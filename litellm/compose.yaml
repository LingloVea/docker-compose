services:
  redis:
    image: arm64v8/redis:7-alpine
    container_name: litellm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    platform: linux/arm64
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY}
      NVIDIA_NIM_API_BASE: ${NVIDIA_NIM_API_BASE}
      OPEN_API_KEY: ${OPEN_API_KEY}
      OPEN_API_BASE: ${OPEN_API_BASE}
      FLY_API_KEY: ${FLY_API_KEY}
      FLY_API_BASE: ${FLY_API_BASE}      
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: --config /app/config.yaml --port 4000
    restart: always
    depends_on:
      - redis
    labels:
      - homepage.group=AI / LLM
      - homepage.name=LiteLLM
      - homepage.icon=si-openai
      - homepage.href=http://${HOMEPAGE_HOST:-192.168.10.8}:4000/
      - homepage.description=多模型代理网关

volumes:
  redis-data:
