model_list:
  - model_name: claude
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: os.environ/NVIDIA_NIM_API_BASE
      rpm: 40
  - model_name: claude
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: os.environ/NVIDIA_NIM_API_BASE
      rpm: 40
  - model_name: claude
    litellm_params:
      model: nvidia_nim/google/gemma-4-31b-it
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: os.environ/NVIDIA_NIM_API_BASE
      rpm: 40
  - model_name: claude
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: os.environ/NVIDIA_NIM_API_BASE
      rpm: 40
  - model_name: claude
    litellm_params:
      model: openrouter/owl-alpha
      api_key: os.environ/OPEN_API_KEY
      api_base: os.environ/OPEN_API_BASE
      rpm: 40

litellm_settings:
  drop_params: true

router_settings:
  routing_strategy: latency-based-routing
