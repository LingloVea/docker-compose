services:
  metapi:
    image: 1467078763/metapi:latest
    ports:
      - "4080:4000"
    volumes:
      - ./data:/app/data
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      PROXY_TOKEN: ${PROXY_TOKEN:?PROXY_TOKEN is required}
      CHECKIN_CRON: "0 8 * * *"
      BALANCE_REFRESH_CRON: "0 * * * *"
      PORT: ${PORT:-4000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
    restart: always
    labels:
      - homepage.group=文件 / 工具
      - homepage.name=MetaPI
      - homepage.icon=si-fastapi
      - homepage.href=http://metapi.metapi.orb.local/
      - homepage.description=MetaPI 服务
